name: Job Alert Check

permissions:
  contents: write

on:
  schedule:
    - cron: "0 3 * * *"   # once daily, ~8:30am IST
  workflow_dispatch:
    inputs:
      use_linkedin:
        description: "Enable TinyFish LinkedIn scrape (slow, often fails on GitHub runners)"
        type: boolean
        default: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run job check
        timeout-minutes: 45
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # TinyFish/LinkedIn often disconnects from GitHub IPs; SerpAPI is reliable on CI.
          SKIP_TINYFISH: ${{ github.event_name == 'workflow_dispatch' && inputs.use_linkedin == true && '0' || '1' }}
        run: python src/main.py

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "job-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/seen_jobs.json data/serpapi_usage.json
          git diff --staged --quiet || git commit -m "Update seen jobs"
          git push
